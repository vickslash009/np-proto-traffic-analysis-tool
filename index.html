<title>NP Proto Traffic Analysis Tool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: an analyst console. Sticky filter rail on top, then explanation first, chart second, full URL ledger last. */
/* Neon theme: one deliberate dark look. Cyan is the interface accent, green and red stay reserved for change. */
:root{
  color-scheme:dark;
  --bg:#070914;--surface:#0f1324;--surface-2:#1a2038;--line:#2b3357;--ink:#f2f5ff;--ink-2:#c0c8e6;--ink-3:#8f99c2;
  --navy:#22e6ff;--navy-ink:#04121a;--gold:#ffe14d;--gold-soft:#332c0c;
  --good:#39ff9c;--good-soft:#0b3324;--bad:#ff4d6d;--bad-soft:#3d1020;--warn:#ffb648;--warn-soft:#3a2710;
  --s1:#22e6ff;--s2:#ff4fd8;--s3:#a78bfa;--s4:#ffe14d;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:radial-gradient(900px 420px at 12% -5%,rgb(34 230 255/.11),transparent 70%),radial-gradient(900px 460px at 92% 0%,rgb(255 79 216/.1),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:14px/1.5 var(--sans);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
a{color:inherit}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:16px;padding-block:9px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:15px;color:var(--navy)}
.brand span{font-size:12px;color:var(--ink-3)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0}
nav button{border:0;background:none;padding:6px 12px;border-radius:5px;color:var(--ink-2);font-weight:500;white-space:nowrap}
nav button:hover{background:var(--surface-2)}
nav button.on{background:var(--navy);color:var(--navy-ink)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:0 9px;align-items:end}
.f{display:flex;flex-direction:column;gap:1px;min-width:0}
.f label{font-size:11px;color:var(--ink-3)}
select,.datebtn,input[type=date],input[type=search],input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-height:32px;max-width:100%}
.datebtn{text-align:left;font-weight:500;min-width:250px;max-width:100%}
.datewrap{position:relative;min-width:0;max-width:100%}
.pop{position:absolute;z-index:50;top:calc(100% + 5px);left:0;width:min(620px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:0 12px 34px rgb(10 20 35/.22);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pop h4{margin:0 0 6px;font-size:12px;color:var(--ink-3);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.opts button{border:1px solid transparent;background:none;text-align:left;border-radius:4px;padding:4px 7px}
.opts button:hover{background:var(--surface-2)}
.opts button.on{background:var(--navy);color:var(--navy-ink)}
.opts button:disabled{opacity:.42;cursor:not-allowed;background:none}
.projwrap{position:relative;min-width:0;max-width:100%}
.projbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:250px;max-width:100%;min-height:32px;background:var(--surface-2);border:1px solid var(--navy);border-radius:5px;padding:5px 9px;font-weight:600;text-align:left;box-shadow:0 0 9px rgb(34 230 255/.22);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.projbtn.locked{border-color:var(--line);box-shadow:none}
.projpop{display:flex;flex-direction:column;gap:8px;width:min(390px,calc(100vw - 32px))}
.projpop input{width:100%}
.projlist{display:flex;flex-direction:column;gap:1px;max-height:330px;overflow:auto}
.projlist button{display:flex;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:6px 8px;border-radius:4px}
.projlist button span{overflow-wrap:anywhere}.projlist small{color:var(--ink-3);white-space:nowrap}
.projlist button:hover{background:var(--surface-2)}.projlist button.on{background:var(--navy);color:var(--navy-ink)}.projlist button.on small{color:inherit}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 18px;margin:0}.facts dt{font-size:11px;font-weight:600;color:var(--ink-3)}.facts dd{margin:0;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:5px 11px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-block:0 8px}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:1px 9px;font-size:12px}
.chip button{border:0;background:none;padding:0 2px;font-weight:700}
main{padding-block:14px 56px;display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--ink-3);font-size:13px;min-width:0}
.crumbs button{border:0;background:none;padding:0;color:var(--navy);font-weight:500}
.crumbs .cur{color:var(--ink);overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.asof{font-size:12px;color:var(--ink-3)}
.demo{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:7px 11px;font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
h1{font-size:22px;line-height:1.25;margin:0;overflow-wrap:anywhere;text-wrap:balance}
h2{font-size:15px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:14px;min-width:0}
.phead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.lead{font-size:17px;line-height:1.45;font-weight:500;max-width:95ch;margin:0}
.lead-sub{color:var(--ink-2);max-width:105ch;margin:6px 0 0}
.tone-bad{border-top:3px solid var(--bad)}.tone-good{border-top:3px solid var(--good)}.tone-flat{border-top:3px solid var(--ink-3)}
.checks{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.check{font-size:12px;background:var(--surface-2);border-radius:4px;padding:2px 8px;color:var(--ink-2)}
.reasons{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.reason{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;padding-block:12px;border-bottom:1px solid var(--line)}
.reason:last-child{border-bottom:0;padding-bottom:0}
.reason h3{font-size:14px;margin:0 0 3px}
.reason p{margin:0;color:var(--ink-2)}
.label{font-size:11px;font-weight:600;color:var(--ink-3);display:block;margin-bottom:3px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap}
.pill.l{background:var(--good-soft);color:var(--good)}.pill.p{background:var(--warn-soft);color:var(--warn)}.pill.n{background:var(--surface-2);color:var(--ink-2)}.pill.b{background:var(--bad-soft);color:var(--bad)}
.share{height:5px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden;max-width:300px}
.share i{display:block;height:100%;background:var(--gold)}
.acts{margin:0;padding-left:18px;color:var(--ink-2)}
.acts li{margin-bottom:4px}
.acts small{color:var(--ink-3);white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.kpi{background:var(--surface);padding:11px 14px;min-width:0}
.kpi span{font-size:12px;color:var(--ink-3)}
.kpi b{display:block;font:500 23px/1.25 var(--mono);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:3px 9px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:var(--navy-ink)}
.mt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px}
.mt i{width:12px;height:3px;border-radius:2px;display:block}
.mt[aria-pressed=false]{color:var(--ink-3)}.mt[aria-pressed=false] i{background:var(--line)!important}
.chart{position:relative;width:100%;height:290px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:5px;font-size:12px;z-index:8;min-width:170px;line-height:1.55;font-variant-numeric:tabular-nums}
.tip div{display:flex;justify-content:space-between;gap:14px}
.note{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tools input[type=search]{width:240px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surface-2);text-align:right;font-weight:600;font-size:12px;padding:6px 8px;white-space:nowrap;color:var(--ink-2);cursor:pointer;user-select:none}
td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
th.t,td.t{text-align:left}
td.u{max-width:430px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:var(--surface-2)}
.lnk{border:0;background:none;padding:0;color:var(--navy);font-weight:500;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.lnk:hover{text-decoration-color:currentColor}
.i{display:inline-grid;place-items:center;width:13px;height:13px;border:1px solid var(--ink-3);border-radius:50%;font-size:9px;color:var(--ink-3);margin-left:3px;font-weight:600;cursor:help}
.pager{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12px;color:var(--ink-3)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:4px 10px;font-size:13px}
.tabs button.on{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 150px;gap:9px;align-items:center;border:0;background:none;padding:4px 5px;border-radius:4px;text-align:left}
.bar:hover,.bar.on{background:var(--surface-2)}
.track{position:relative;height:14px}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--ink-3)}
.track i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.bar .v{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);font-weight:500;min-width:0}
.form textarea{min-height:112px;font:12px/1.5 var(--mono);width:100%}
.form input,.form select{width:100%}
.drop{border:2px dashed var(--line);border-radius:7px;padding:22px;text-align:center;color:var(--ink-2);display:block;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--navy);background:var(--surface-2)}
code{font:12px var(--mono);background:var(--surface-2);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
.toast{position:fixed;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;max-width:min(420px,calc(100vw - 32px))}
.spark{display:block}
@media(max-width:1000px){.reason,.grid2,.form{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.pop{grid-template-columns:minmax(0,1fr);max-height:70vh;overflow:auto}.datebtn{min-width:0;width:100%}.datewrap{width:100%}.f{flex:1 1 44%}.f.dw{flex-basis:100%}.f select{width:100%}.tools input[type=search]{width:100%}.bar{grid-template-columns:88px minmax(0,1fr) 112px}header{position:static}.chart{height:240px}}
@media(prefers-reduced-motion:no-preference){.btn,.lnk{transition:background .12s,box-shadow .12s}}
header{background:var(--surface);border-bottom-color:rgb(34 230 255/.35);box-shadow:0 0 22px rgb(34 230 255/.12)}
.brand b{text-shadow:0 0 12px rgb(34 230 255/.55)}
nav button.on,.btn.primary,.tabs button.on,.seg button.on{box-shadow:0 0 14px rgb(34 230 255/.5)}
.btn:hover,.mt:hover,.tabs button:hover{border-color:var(--navy);box-shadow:0 0 9px rgb(34 230 255/.28)}
.panel{box-shadow:inset 0 1px 0 rgb(255 255 255/.03)}
.tone-bad{box-shadow:0 -2px 16px rgb(255 77 109/.28)}.tone-good{box-shadow:0 -2px 16px rgb(57 255 156/.25)}
.kpi b{color:var(--navy);text-shadow:0 0 12px rgb(34 230 255/.42)}
.up{text-shadow:0 0 8px rgb(57 255 156/.3)}.down{text-shadow:0 0 8px rgb(255 77 109/.3)}
.share i{box-shadow:0 0 8px var(--gold)}
.track i{box-shadow:0 0 8px currentColor}
.chart path[stroke="var(--s1)"]:not([stroke-dasharray]){filter:drop-shadow(0 0 4px rgb(34 230 255/.75))}
.chart path[stroke="var(--s2)"]:not([stroke-dasharray]){filter:drop-shadow(0 0 4px rgb(255 79 216/.75))}
.chart path[stroke="var(--s3)"]:not([stroke-dasharray]){filter:drop-shadow(0 0 4px rgb(167 139 250/.75))}
.chart path[stroke="var(--s4)"]:not([stroke-dasharray]){filter:drop-shadow(0 0 4px rgb(255 225 77/.7))}
.tip,.toast{background:#050714;color:var(--ink);border:1px solid var(--navy);box-shadow:0 0 16px rgb(34 230 255/.35)}
.pop{box-shadow:0 12px 34px rgb(0 0 0/.6),0 0 20px rgb(34 230 255/.2)}
.chip{box-shadow:0 0 8px rgb(255 225 77/.25)}
</style>

<header><div class="wrap">
  <div class="top">
    <div class="brand"><b id="client"></b><span id="domain"></span></div>
    <div class="projwrap" id="projWrap"></div>
    <nav id="nav" aria-label="Views"></nav>
    <button class="btn" id="roleBtn"></button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="chips" id="chips" hidden></div>
</div></header>
<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";
/* ---------- Basics ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DMS=864e5, toDn=s=>Math.floor(Date.parse(s+"T00:00:00Z")/DMS), dnDate=d=>new Date(d*DMS), dnIso=d=>dnDate(d).toISOString().slice(0,10);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dLabel=(d,y=true)=>{const x=dnDate(d);return x.getUTCDate()+" "+MON[x.getUTCMonth()]+(y?" "+x.getUTCFullYear():"")};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,4200)}

/* ---------- Config ---------- */
const DEFAULT_CFG={client:"Demo Finance Co",domain:"demo-finance.example",
 sections:"Credit Cards=/credit-cards/\nLoans=/loans/\nInsurance=/insurance/\nInvesting=/investing/\nBlog=/blog/\nCalculators=/calculators/",
 types:"Calculator=/calculators/\nComparison=best-|-vs-|compare\nGuide=how-to|guide|what-is\nProduct=apply|review",
 competitors:"rivalbank.example\nmoneyguide.example\nfinscout.example",brand:"demo finance,demofinance",numberFormat:"in",threshold:10,updates:""};
let CFG={...DEFAULT_CFG,...(store.get("seo-dash-cfg")||{})};
const parseRules=t=>String(t||"").split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf("=");return i<1?null:{name:l.slice(0,i).trim(),rule:l.slice(i+1).trim()}}).filter(Boolean);
function safeRe(s){try{return new RegExp(s,"i")}catch(e){return null}}
function sectionOf(url){let path=url;try{path=new URL(url).pathname}catch(e){}
 for(const r of parseRules(CFG.sections))if(path.toLowerCase().startsWith(r.rule.toLowerCase()))return r.name;
 const f=path.split("/").filter(Boolean)[0];return f?f.replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase()):"Home"}
function typeOf(url){let path=url;try{path=new URL(url).pathname}catch(e){}
 for(const r of parseRules(CFG.types)){const re=safeRe(r.rule);if(re&&re.test(path))return r.name}return "Other"}
const isBrand=q=>String(CFG.brand||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean).some(b=>q.toLowerCase().includes(b));
function parseUpdates(){return parseRules(CFG.updates).map(r=>({name:r.name,day:toDn(r.rule)})).filter(u=>Number.isFinite(u.day))}

/* ---------- Number and delta formatting ---------- */
const loc=()=>CFG.numberFormat==="in"?"en-IN":"en-US";
const N=(v,d=0)=>v==null||!isFinite(v)?"–":v.toLocaleString(loc(),{maximumFractionDigits:d,minimumFractionDigits:d});
function compact(v){const a=Math.abs(v);const f=(x,s)=>(+x.toFixed(x>=100?0:1))+s;const sg=v<0?"−":"";
 if(CFG.numberFormat==="in"){if(a>=1e7)return sg+f(a/1e7," Cr");if(a>=1e5)return sg+f(a/1e5," L");if(a>=1e3)return sg+f(a/1e3,"K");return sg+Math.round(a)}
 if(a>=1e9)return sg+f(a/1e9,"B");if(a>=1e6)return sg+f(a/1e6,"M");if(a>=1e3)return sg+f(a/1e3,"K");return sg+Math.round(a)}
const sign=(v,d=0)=>(v>0?"+":v<0?"−":"")+N(Math.abs(v),d);
const pct=(a,b)=>b>0?(a-b)/b*100:null;
const pctS=p=>p==null?"new":(p>0?"+":p<0?"−":"")+Math.abs(p).toFixed(1)+"%";
function dl(cur,prev,o={}){ // absolute + % always side by side
 if(prev==null||!WIN().hasC)return '<span class="flat">n/a</span>';
 const d=cur-prev,dec=o.dec??0;if(Math.abs(d)<(dec?Math.pow(10,-dec)/2:.5))return '<span class="flat">● 0'+(o.unit||"")+'</span>';
 const good=o.inv?d<0:d>0,arrow=good?"▲":"▼";
 const p=o.noPct?"":" ("+pctS(pct(cur,prev))+")";
 return `<span class="${good?"up":"down"}">${arrow} ${sign(d,dec)}${o.unit||""}${p}</span>`}
const posDl=(c,p)=>c==null||p==null?'<span class="flat">–</span>':dl(c,p,{inv:true,dec:1,noPct:true});

/* ---------- Data store. Each series is one page + keyword, sparse by day. ---------- */
let DB=null;
function indexDB(db){db.byPage=db.pages.map(()=>[]);db.byKw=db.kws.map(()=>[]);db.series.forEach((s,i)=>{db.byPage[s.p].push(i);db.byKw[s.k].push(i)});
 db.devices=db.devices||["mobile","desktop","tablet"];db.countries=db.countries||[];classify(db);return db}
function classify(db){db.pages.forEach(p=>{p.section=p.synthetic?"Outside export":sectionOf(p.url);p.type=p.synthetic?"Outside export":typeOf(p.url)});db.kws.forEach(k=>k.brand=!k.synthetic&&isBrand(k.q))}

function genDemo(){

 else if(d.go){const[k,id]=d.go.split(":");nav(k,k==="page"?{page:+id}:{kw:+id})}
 else if("sec"in d){S.section=S.section===d.sec?"all":d.sec;if(S.view==="page"||S.view==="kw"){S.view="sections"}render()}
 else if("back"in d){const b=S.stack.pop();if(b){S.view=b.view;S.page=b.page;S.kw=b.kw;render();scrollTo(0,b.y||0)}}
 else if(d.crumb){const[a,...r]=d.crumb.split(":"),v=r.join(":");if(a==="section"){S.section=v;nav("sections")}else if(a==="page")nav("page",{page:+v});else nav(a)}
 else if(d.sort){const i=d.sort.indexOf(":"),id=d.sort.slice(0,i),k=d.sort.slice(i+1),st=S.tables[id];if(st.sort===k)st.dir*=-1;else{st.sort=k;st.dir=-1}st.page=0;drawTable(id)}
 else if(d.pg){const[id,x]=d.pg.split(":");S.tables[id].page+=+x;drawTable(id)}
 else if(d.export)exportCsv(d.export);
 else if(d.metric){S.m[d.metric]=!S.m[d.metric];$$(`[data-metric="${d.metric}"]`).forEach(b=>b.setAttribute("aria-pressed",S.m[d.metric]));CHARTS.forEach(drawChart)}
 else if(d.gran){S.gran=d.gran;render()}
 else if("overlay"in d){S.overlay=!S.overlay;$$("[data-overlay]").forEach(b=>b.setAttribute("aria-pressed",S.overlay));CHARTS.forEach(drawChart)}
 else if(d.preset){S.preset=d.preset;if(S.cmp==="wow"||S.cmp==="mom")S.cmp="prev";render()}
 else if(d.cmp){S.cmp=d.cmp;if(d.cmp==="custom"&&S.cfrom==null){const W=WIN();S.cfrom=DB.end-55;S.cto=DB.end-28}render()}
 else if(d.quick){if(d.quick==="wow"){S.preset="tw";S.cmp="wow"}else if(d.quick==="mom"){S.preset="tm";S.cmp="mom"}else if(d.quick==="l4w"){S.preset="l28";S.cmp="prev"}else{S.preset="l3m";S.cmp="prev"}render()}
 else if("closepop"in d){S.pop=false;drawFilters()}
 else if(d.clear){if(d.clear==="all"){S.section=S.device=S.country=S.brand=S.ptype="all"}else S[d.clear]="all";render()}
 else if("more"in d)loadMoreProject();
 else if(d.ptab){S.pageTab=d.ptab;Object.keys(S.tables).forEach(k=>{if(S.tables[k])S.tables[k].page=0});render()}
 else if(d.ktab){S.kwTab=d.ktab;render()}
 else if(t.id==="roleBtn"){S.readonly=!S.readonly;if(S.readonly&&S.view==="setup"){S.view="overview";S.stack=[]}render()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("th[data-sort]")){e.preventDefault();e.target.click()}if(e.key==="Escape"&&S.pop){S.pop=false;drawFilters()}if(e.key==="Escape"&&PROJ.open){PROJ.open=false;drawProject()}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(d.filter){S[d.filter]=t.value;render()}else if(d.size){const st=S.tables[d.size];st.size=+t.value;st.page=0;drawTable(d.size)}
 else if(t.id==="d-from"||t.id==="d-to"){const a=$("#d-from").value,b=$("#d-to").value;if(a&&b&&a<=b){S.preset="custom";S.from=toDn(a);S.to=toDn(b);if(S.cmp==="wow"||S.cmp==="mom")S.cmp="prev";render()}else toast("Choose a start date on or before the end date.")}
 else if(t.id==="c-from"||t.id==="c-to"){const a=$("#c-from").value,b=$("#c-to").value;if(a&&b&&a<=b){S.cfrom=toDn(a);S.cto=toDn(b);render()}else toast("Choose a comparison start on or before its end date.")}});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>CHARTS.forEach(drawChart),120)});
try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>CHARTS.forEach(drawChart))}catch(e){}

/* Performance test hook: builds a sparse synthetic store of n URLs and reports timings. */
window.__seoStress=function(n=50000){const t0=performance.now(),L=510,end=DB.end,start=end-L+1,r=mulberry(9),pages=[],kws=[],series=[];for(let i=0;i<n;i++){pages.push({id:i,url:`https://stress.example/s${i%20}/page-${i}/`,status:200,index:"indexable",rd:10,rd0:10});kws.push({id:i,q:"stress keyword "+i,vol:100,aioFrom:null,comp:null});const m=20,d=new Uint16Array(m),c=new Float32Array(m),im=new Float32Array(m),po=new Float32Array(m);let x=Math.floor(r()*40);for(let j=0;j<m;j++){x=Math.min(L-1-(m-1-j),x+1+Math.floor(r()*24));d[j]=x;im[j]=5+Math.floor(r()*80);c[j]=Math.floor(im[j]*.05);po[j]=4+r()*20}series.push({p:i,k:i,d,c,i:im,po,dv:[.7,.25,.05],cy:[1]})}
 const saved=DB;DB=indexDB({demo:true,start,n:L,end,pages,kws,series,countries:["India"],devices:["mobile","desktop","tablet"],sources:{gsc:"Stress",semrush:"Stress",ahrefs:"Stress"}});_r=null;_w=null;const t1=performance.now();render();const t2=performance.now();S.section=DB.pages[0].section;render();const t3=performance.now();S.section="all";DB=saved;_r=null;_w=null;render();return{urls:n,build_ms:Math.round(t1-t0),first_render_ms:Math.round(t2-t1),filter_render_ms:Math.round(t3-t2)}};
